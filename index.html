<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orações | Momento de Fé</title>
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="top-cross">
        <i class="fas fa-cross"></i>
    </div>

    <div class="main-container">
        <div class="search-header">
            <h1 class="search-title">Digite sua oração abaixo!</h1>
        </div>

        <div class="search-container">
<form class="search-box" onsubmit="handleSearch(event)">
    <i class="fas fa-hands-praying search-icon"></i>
    <div class="inputs">
        <input type="text" class="search-input" placeholder="Seu nome..." id="nameInput" autocomplete="off">
        <input type="text" class="search-input" placeholder="Escreva aqui sua oração..." id="searchInput" autocomplete="off">
    </div>
    <button type="submit" class="search-btn">Enviar</button>
</form>
        </div>
    </div>

    <script>
        async function handleSearch(event) {
    event.preventDefault();

    const name = document.getElementById('nameInput').value.trim();
    const prayer = document.getElementById('searchInput').value.trim();

    if (name === "" || prayer === "") {
        alert('Preencha seu nome e sua oração!');
        return;
    }

    try {
        const response = await fetch('http://127.0.0.1:8000/prayer', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, prayer })
        });

        if (response.ok) {
            alert('Sua oração foi enviada com fé! 🙏');
            document.getElementById('nameInput').value = "";
            document.getElementById('searchInput').value = "";
        } else {
            alert('Erro ao enviar, tente novamente.');
        }
    } catch (error) {
        alert('Não foi possível conectar ao servidor.');
        console.error(error);
    }
}
    </script>
</body>
